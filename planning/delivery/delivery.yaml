  - id: problem-approval-gated-validation
    type: problem
    title: Generated PR validation can be approval-gated
    summary: Generated PRs from automation can require downstream PR validation approval before proof is visible.

  - id: problem-snapshot-pr-backlog
    type: problem
    title: Generated snapshot PR backlog
    summary: Scheduled ingestion originally opened a new generated source snapshot PR each run, creating review inventory faster than the demo needed.

  - id: decision-self-proof-before-pr
    type: decision
    title: Prove generated report before opening PR
    summary: Keep the existing workflow identity and make the generating workflow run validation, tests, site build, rendered-path proof, changed-file scope validation, and PR evidence construction before opening the generated PR.

  - id: decision-rolling-source-snapshot-pr
    type: decision
    title: Use one rolling source snapshot PR
    summary: Keep the scheduled ingestion demo running while updating a stable rolling branch and PR instead of opening a new snapshot PR every run.

  - id: boundary-no-committed-site
    type: boundary
    title: No committed _site output
    summary: Generated _site output may be built for proof, but must remain disposable and uncommitted.

  - id: boundary-no-credential-expansion
    type: boundary
    title: No credential expansion
    summary: Phase 3 deliberately avoided expanding repository credentials.

  - id: boundary-no-llm-report-narrative
    type: boundary
    title: No LLM-generated report narrative
    summary: Deterministic reports remain non-LLM generated in the proven flow.

  - id: boundary-no-advice-like-content
    type: boundary
    title: No advice-like report content
    summary: Reports remain demo content and must not become recommendations or trading guidance.

  - id: lesson-source-snapshots-as-evidence
    type: lesson
    title: Treat source snapshots as immutable evidence
    summary: Source ingestion, report generation, and site publication should remain separate, reviewable steps.

  - id: lesson-layered-validation
    type: lesson
    title: Treat pre-PR proof and downstream validation as layered controls
    summary: Self-proofing makes generated PRs reviewable before downstream validation, but does not make downstream validation unnecessary.

  - id: phase-12
    type: phase
    title: Phase 12 — Canonical observation-hour evidence
    status: complete
    summary: Future source snapshots preserve actual generation and fetch timestamps while adding separately validated canonical containing-hour identity for later governed consumers.
    record: planning/delivery/phase-12-canonical-observation-hour-evidence.md

