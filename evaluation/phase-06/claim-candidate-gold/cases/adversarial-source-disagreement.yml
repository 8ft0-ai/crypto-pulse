key: adversarial-source-disagreement
classification: evaluation-only
expected_candidate_count: 230
expected_ordered_candidate_sha256: e0d0199fecb9c33e07662cd5074e0629bc9877cc8fb409cfd486d36ccef86ce6
expectations:
- name: btc-price
  rationale: The canonical CoinGecko Bitcoin price remains available.
  match:
    intent: absolute_observation
    metric: price_usd
    comparison_relation: none
    evidence_ids:
    - market.asset.bitcoin.price_usd
- name: coinbase-mutated-price
  rationale: The evaluation-only Coinbase price remains visible as a raw absolute observation.
  match:
    intent: absolute_observation
    metric: price
    comparison_relation: none
    evidence_ids:
    - exchange.coinbase_exchange.btc-usd.price
- name: sol-24h-direction
  rationale: Unrelated material movement remains available.
  match:
    intent: directional_observation
    metric: change_24h_pct
    comparison_relation: none
    evidence_ids:
    - market.asset.solana.change_24h_pct
- name: btc-eth-price-comparison
  rationale: Unrelated canonical asset-price comparison remains available.
  match:
    intent: comparison
    metric: price_usd
    comparison_relation: greater_than
    evidence_ids:
    - market.asset.bitcoin.price_usd
    - market.asset.ethereum.price_usd
- name: coinbase-status
  rationale: The source-disagreement mutation does not alter source status.
  match:
    intent: source_status
    metric: status
    comparison_relation: none
    evidence_ids:
    - source.coinbase_exchange.status
- name: snapshot-status
  rationale: The evaluation-only mutation does not alter snapshot status.
  match:
    intent: snapshot_status
    metric: status
    comparison_relation: none
    evidence_ids:
    - quality.snapshot.status
forbidden:
- name: raw-disagreement-not-comparable
  rationale: The mutated exchange `price` cannot be paired with canonical asset `price_usd` before explicit normalisation.
  predicate: evidence_ids_together
  evidence_ids:
  - exchange.coinbase_exchange.btc-usd.price
  - market.asset.bitcoin.price_usd
- name: no-incompatible-comparison
  rationale: The obvious value disagreement does not permit field or unit repair inside the compiler.
  predicate: comparison_field_or_unit_mismatch
- name: no-mixed-source-status
  rationale: One source-status candidate cannot cite multiple source subjects.
  predicate: mixed_source_status
forbidden_text:
- caused by
- because of
omissions:
- name: raw-cross-source-disagreement
  rationale: The raw evidence is intentionally incompatible; the compiler does not infer normalisation or causality.
  evidence_ids:
  - exchange.coinbase_exchange.btc-usd.price
  - market.asset.bitcoin.price_usd
