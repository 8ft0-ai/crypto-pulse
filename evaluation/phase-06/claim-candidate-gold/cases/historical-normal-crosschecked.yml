key: historical-normal-crosschecked
classification: historical
expected_candidate_count: 230
expected_ordered_candidate_sha256: 0e3fba876a8fc81f61dd567e7536cc281d59addc55961bd81b3a928d406c8f4c
expectations:
- name: btc-price
  rationale: Bitcoin spot price anchors the normal market snapshot.
  match:
    intent: absolute_observation
    metric: price_usd
    comparison_relation: none
    evidence_ids:
    - market.asset.bitcoin.price_usd
- name: coinbase-btc-price
  rationale: The raw Coinbase BTC-USD price remains available as its own absolute observation.
  match:
    intent: absolute_observation
    metric: price
    comparison_relation: none
    evidence_ids:
    - exchange.coinbase_exchange.btc-usd.price
- name: btc-24h-direction
  rationale: Bitcoin 24-hour movement is available as a directional candidate.
  match:
    intent: directional_observation
    metric: change_24h_pct
    comparison_relation: none
    evidence_ids:
    - market.asset.bitcoin.change_24h_pct
- name: sol-24h-direction
  rationale: Solana 24-hour movement is available as a material directional candidate.
  match:
    intent: directional_observation
    metric: change_24h_pct
    comparison_relation: none
    evidence_ids:
    - market.asset.solana.change_24h_pct
- name: btc-eth-price-comparison
  rationale: Bitcoin and Ethereum canonical USD prices are comparable.
  match:
    intent: comparison
    metric: price_usd
    comparison_relation: greater_than
    evidence_ids:
    - market.asset.bitcoin.price_usd
    - market.asset.ethereum.price_usd
- name: btc-eth-24h-comparison
  rationale: Bitcoin and Ethereum 24-hour percentage changes are comparable.
  match:
    intent: comparison
    metric: change_24h_pct
    comparison_relation: greater_than
    evidence_ids:
    - market.asset.bitcoin.change_24h_pct
    - market.asset.ethereum.change_24h_pct
- name: coingecko-status
  rationale: The primary market source has a bounded healthy status candidate.
  match:
    intent: source_status
    metric: status
    comparison_relation: none
    evidence_ids:
    - source.coingecko.status
- name: coinbase-status
  rationale: The exchange cross-check source has a bounded healthy status candidate.
  match:
    intent: source_status
    metric: status
    comparison_relation: none
    evidence_ids:
    - source.coinbase_exchange.status
- name: binance-limitation
  rationale: The skipped optional Binance source remains an explicit limitation without degrading the snapshot.
  match:
    intent: data_quality_limitation
    metric: status
    comparison_relation: none
    evidence_ids:
    - source.binance.reason
    - source.binance.status
- name: snapshot-status
  rationale: The valid-ok snapshot status remains available and is not a limitation.
  match:
    intent: snapshot_status
    metric: status
    comparison_relation: none
    evidence_ids:
    - quality.snapshot.status
forbidden:
- name: no-implicit-price-normalisation
  rationale: Raw exchange `price` and market `price_usd` are different measures.
  predicate: evidence_ids_together
  evidence_ids:
  - exchange.coinbase_exchange.btc-usd.price
  - market.asset.bitcoin.price_usd
- name: healthy-snapshot-not-limitation
  rationale: A valid-ok snapshot is status evidence, not a data-quality limitation.
  predicate: candidate_match
  match:
    intent: data_quality_limitation
    evidence_ids:
    - quality.snapshot.status
- name: no-mixed-source-status
  rationale: One source-status candidate cannot cite multiple source subjects.
  predicate: mixed_source_status
forbidden_text: []
omissions:
- name: raw-cross-source-price
  rationale: The raw Coinbase record is `price` on an exchange-pair subject, so no hidden comparison is created.
  evidence_ids:
  - exchange.coinbase_exchange.btc-usd.price
  - market.asset.bitcoin.price_usd
- name: healthy-snapshot-limitation
  rationale: The valid-ok snapshot remains a status candidate only.
  evidence_ids:
  - quality.snapshot.status
