assets:
  required_symbols:
    - BTC
    - ETH
    - SOL
  coingecko_ids:
    - bitcoin
    - ethereum
    - solana

coingecko:
  vs_currency: usd
  include_market_cap: true
  include_24h_vol: true
  include_24h_change: true

defillama:
  include_total_tvl: true
  include_stablecoins: true
  stablecoin_limit: 10
  major_stablecoins:
    - USDT
    - USDC

sources:
  coingecko:
    required: true
    role: market
  defillama:
    required: true
    role: defi_stablecoins

exchange_crosschecks:
  required: false
  strategy: first_successful
  sources:
    - name: coinbase_exchange
      enabled: true
      quote: USD
      pairs:
        BTC: BTC-USD
        ETH: ETH-USD
        SOL: SOL-USD
    - name: kraken
      enabled: true
      quote: USD
      pairs:
        BTC: XBTUSD
        ETH: ETHUSD
        SOL: SOLUSD
    - name: okx
      enabled: true
      quote: USDT
      pairs:
        BTC: BTC-USDT
        ETH: ETH-USDT
        SOL: SOL-USDT
    - name: binance
      enabled: false
      quote: USDT
      reason: GitHub-hosted runners returned HTTP 451
    - name: bybit
      enabled: false
      quote: USDT
      reason: GitHub-hosted runners returned HTTP 403
    - name: cryptocompare
      enabled: false
      quote: USD
      reason: No-secrets MVP returned HTTP 401 without an API key

quality:
  freshness_tolerance_minutes: 180
  stablecoin_peg_warning_threshold_pct: 1.0

limits:
  request_timeout_seconds: 20
  max_retries: 2
