name: Temporary corpus hash probe

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  hash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Calculate locked snapshot hashes
        shell: bash
        run: |
          sha256sum \
            data/crypto/hourly/2026/07/08/1434_AEST_source_snapshot.json \
            data/crypto/hourly/2026/07/08/1742_AEST_source_snapshot.json \
            data/crypto/hourly/2026/07/08/2031_AEST_source_snapshot.json \
            > corpus-hashes.txt
      - uses: actions/upload-artifact@v4
        with:
          name: corpus-hashes
          path: corpus-hashes.txt
          if-no-files-found: error
          retention-days: 1
