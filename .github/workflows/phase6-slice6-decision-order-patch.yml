name: Fix Slice 6 decisive decision order

on:
  push:
    branches:
      - agent/correct-phase-6-slice-6-provider-transport

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/correct-phase-6-slice-6-provider-transport
      - name: Reorder deployment decisive failure
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('llm_analysis/candidate_selection_model_scoring.py')
          source = path.read_text()
          block = '''    if (
        isinstance(deployment, Mapping)
        and deployment.get("decisive_acceptance_failure") is True
        and deployment.get("observed_governance_pass") is True
    ):
        return {
            "status": "complete",
            "outcome": plan.outcomes["deployment_candidate_failed"],
            "quality_gate": quality_checks,
            "deployment_gate": {
                "minimum_accepted_runs": False,
                "decisive_two_fallback_stop": True,
                "governance": True,
            },
        }

'''
          if source.count(block) != 1:
              raise SystemExit('deployment decisive block missing')
          source = source.replace(block, '', 1)
          marker = '''    complete = (
        isinstance(quality, Mapping)
        and isinstance(deployment, Mapping)
'''
          replacement = '''    quality_complete = (
        isinstance(quality, Mapping)
        and quality.get("completed_runs") == quality.get("expected_runs")
        and quality.get("route_pass") is True
        and quality.get("availability_pass") is True
        and quality.get("cost_metadata_complete") is not False
    )
    if not quality_complete:
        return {
            "status": "inconclusive",
            "outcome": plan.outcomes["infrastructure_failure"],
            "quality_gate": {},
            "deployment_gate": {},
        }

    quality_checks = {
        "minimum_accepted_runs": int(quality["accepted_runs"])
        >= plan.quality_gate.minimum_accepted_runs,
        "zero_prohibited_selections": int(quality["prohibited_selected_count"]) == 0,
        "minimum_precision": float(quality["precision"])
        >= plan.quality_gate.minimum_precision,
        "minimum_recall": float(quality["recall"])
        >= plan.quality_gate.minimum_recall,
        "minimum_f1": float(quality["f1"]) >= plan.quality_gate.minimum_f1,
        "minimum_stability": float(quality["mean_pairwise_jaccard"])
        >= plan.quality_gate.minimum_mean_pairwise_jaccard,
        "governance": quality.get("governance_pass") is True,
    }
    if not _checks_pass(quality_checks):
        return {
            "status": "complete",
            "outcome": plan.outcomes["quality_benchmark_failed"],
            "quality_gate": quality_checks,
            "deployment_gate": {},
        }

''' + block + '''    complete = (
        isinstance(quality, Mapping)
        and isinstance(deployment, Mapping)
'''
          if source.count(marker) != 1:
              raise SystemExit('complete marker missing')
          source = source.replace(marker, replacement, 1)
          duplicate_start = source.find('    quality_checks = {', source.find('    complete = ('))
          if duplicate_start == -1:
              raise SystemExit('duplicate quality checks not found')
          duplicate_end_marker = block
          duplicate_end = source.find(duplicate_end_marker, duplicate_start)
          if duplicate_end == -1:
              raise SystemExit('duplicate region end not found')
          source = source[:duplicate_start] + source[duplicate_end + len(duplicate_end_marker):]
          path.write_text(source)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add llm_analysis/candidate_selection_model_scoring.py
          git commit -m 'Evaluate decisive deployment failure before full-corpus requirement'
          git push

      # Branch-local migration workflow; removed before review.
