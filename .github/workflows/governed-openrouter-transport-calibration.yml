name: Governed OpenRouter transport calibration

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: governed-openrouter-transport-calibration-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  guard:
    name: Require trusted main or exact owner nonce
    runs-on: ubuntu-24.04
    steps:
      - name: Authorise exact one-time execution event
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "Manual dispatch must use main." >&2
              exit 1
            fi
            exit 0
          fi
          if [[ "$EVENT_NAME" != "issue_comment" \
             || "$EVENT_ACTION" != "created" \
             || "$ISSUE_NUMBER" != "325" \
             || "$COMMENT_AUTHOR" != "8ft0-ai" \
             || "$COMMENT_BODY" != "/run-phase8-observable-transport-calibration-20260803" ]]; then
            echo "This issue comment is not the authorised Phase 8 nonce." >&2
            exit 1
          fi

  prepare:
    name: Freeze real Phase 8 selector input
    needs: guard
    runs-on: ubuntu-24.04
    outputs:
      trusted_sha: ${{ steps.trusted.outputs.sha }}
    steps:
      - name: Check out trusted main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Record trusted main commit
        id: trusted
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependency
        run: pip install pyyaml

      - name: Regenerate the real 201-candidate input
        shell: bash
        run: |
          set -euo pipefail
          python -m llm_analysis.openrouter_transport_calibration_runner prepare \
            --repository-root . \
            --config config/openrouter-transport-calibration-v1.yml \
            --output-dir "$RUNNER_TEMP/openrouter-transport-calibration-prepared"

      - name: Upload prepared Phase 8 input
        uses: actions/upload-artifact@v4
        with:
          name: openrouter-transport-calibration-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/openrouter-transport-calibration-prepared/
          if-no-files-found: error
          retention-days: 7

  calibrate:
    name: Run protected observable transport calibration
    needs: prepare
    runs-on: ubuntu-24.04
    environment: governed-llm-dry-run
    steps:
      - name: Check out exact trusted main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.trusted_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify trusted commit
        env:
          TRUSTED_SHA: ${{ needs.prepare.outputs.trusted_sha }}
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$TRUSTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependency
        run: pip install pyyaml

      - name: Download prepared Phase 8 input
        uses: actions/download-artifact@v4
        with:
          name: openrouter-transport-calibration-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/openrouter-transport-calibration-prepared

      - name: Run real-request discovery and reproduction
        id: calibration
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TRUSTED_SHA: ${{ needs.prepare.outputs.trusted_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python -m llm_analysis.openrouter_transport_calibration_runner run \
            --repository-root . \
            --config config/openrouter-transport-calibration-v1.yml \
            --prepared-dir "$RUNNER_TEMP/openrouter-transport-calibration-prepared" \
            --output-dir "$RUNNER_TEMP/openrouter-transport-calibration" \
            --trusted-main-sha "$TRUSTED_SHA"

      - name: Publish Phase 8 summary
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/openrouter-transport-calibration/actions-summary.md" ]]; then
            cat "$RUNNER_TEMP/openrouter-transport-calibration/actions-summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "# Phase 8 observable transport calibration" >> "$GITHUB_STEP_SUMMARY"
            echo "The protected runner failed before producing a complete summary." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload protected Phase 8 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openrouter-transport-calibration-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/openrouter-transport-calibration/
          if-no-files-found: warn
          retention-days: 30

      - name: Fail when calibration integrity failed
        if: steps.calibration.outcome != 'success'
        shell: bash
        run: |
          echo "The Phase 8 calibration runner did not complete. Review retained evidence." >&2
          exit 1