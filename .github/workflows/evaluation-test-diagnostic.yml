name: Temporary evaluation test diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml markdown
      - name: Capture focused test output
        shell: bash
        run: |
          set +e
          python -m unittest \
            tests.test_llm_analysis_evaluation \
            tests.test_llm_evaluation_corpus_lock \
            tests.test_governed_llm_evaluation_workflow -v \
            > evaluation-test-output.txt 2>&1
          echo $? > evaluation-test-exit-code.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: evaluation-test-diagnostic
          path: |
            evaluation-test-output.txt
            evaluation-test-exit-code.txt
          if-no-files-found: error
          retention-days: 1
