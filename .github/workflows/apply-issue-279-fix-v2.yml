name: Apply issue 279 legacy RunRecord fix v2

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write

jobs:
  apply-fix:
    name: Apply exact issue 279 patch with recounted hunks
    if: >-
      github.event.issue.number == 279 &&
      github.event.comment.user.login == '8ft0-ai' &&
      github.event.comment.body == '/apply-issue-279-fix-20260804-v2'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out trusted main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create scoped branch
        run: git checkout -B agent/fix-legacy-ineligible-run-record origin/main

      - name: Recover unchanged reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import re
          from pathlib import Path

          workflow = Path('.github/workflows/apply-issue-279-fix.yml').read_text(encoding='utf-8')
          match = re.search(r'^\s*PATCH_BASE64:\s*(\S+)\s*$', workflow, flags=re.MULTILINE)
          if not match:
              raise SystemExit('reviewed patch payload was not found')
          Path('issue-279.patch').write_bytes(base64.b64decode(match.group(1), validate=True))
          PY
          git apply --recount --check issue-279.patch

      - name: Apply patch and run focused regression
        run: |
          set -euo pipefail
          git apply --recount issue-279.patch
          python -m pip install pyyaml
          python -m unittest tests.test_llm_analysis_evaluation -v

      - name: Commit and push scoped fix
        run: |
          set -euo pipefail
          git add llm_analysis/evaluation.py tests/test_llm_analysis_evaluation.py
          git commit -m "Fix legacy ineligible RunRecord construction"
          git push --force-with-lease origin agent/fix-legacy-ineligible-run-record

      - name: Open fix pull request
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = 'agent/fix-legacy-ineligible-run-record';
            const existing = await github.rest.pulls.list({owner, repo, state: 'open', head: `${owner}:${head}`, base: 'main'});
            const title = 'Fix legacy ineligible RunRecord construction';
            const body = `Closes #279.\n\nReplaces the retained legacy positional RunRecord constructor with explicit keyword fields and adds a regression proving ineligible models create complete records without constructing a provider client.\n\nNo evaluation policy, model, provider, workflow, cost, generation or publication behavior changes.`;
            if (existing.data.length) {
              await github.rest.pulls.update({owner, repo, pull_number: existing.data[0].number, title, body});
            } else {
              await github.rest.pulls.create({owner, repo, title, body, head, base: 'main'});
            }
