name: Retain Phase 6 Slice 5 proof

on:
  push:
    branches:
      - agent/phase-6-slice-5-bounded-candidate-selection

permissions:
  contents: write

concurrency:
  group: phase6-slice5-retain-proof
  cancel-in-progress: true

jobs:
  retain:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-6-slice-5-bounded-candidate-selection
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml markdown
      - name: Generate canonical proof artefacts
        run: python -m llm_analysis.candidate_selection_proof
      - name: Commit generated proof artefacts
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add evaluation/phase-06/candidate-selection
          if git diff --cached --quiet; then
            echo 'No proof artefact changes.'
            exit 0
          fi
          git commit -m 'Retain bounded selector proof artefacts'
          git push
