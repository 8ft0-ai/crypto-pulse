name: Validate CryptoPulse PR

on:
  pull_request:
    branches:
      - main
    paths:
      - "**/*.md"
      - "reports/crypto/hourly/**/*.md"
      - "site/**"
      - "site_generator/**"
      - "scripts/**"
      - ".github/workflows/**"
      - "docs/**"
      - "planning/**"
      - "README.md"
      - "tests/**"
      - "config/**"

permissions:
  contents: read

concurrency:
  group: cryptopulse-pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build site and check generated output
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml markdown

      - name: Run semantic-plan benchmark integration tests
        run: |
          python -m unittest tests.test_semantic_plan_benchmark -v

      - name: Run public-data policy compatibility tests
        run: |
          python -m unittest tests.test_llm_public_data_demo -v

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests

      - name: Validate documentation
        run: |
          python scripts/validate_documentation.py

      - name: Reject committed generated site output
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '^_site/'; then
            echo "Generated _site/ output must not be committed. Build output is disposable and produced by GitHub Actions." >&2
            exit 1
          fi

      - name: Build static site
        run: |
          python -m site_generator

      - name: Verify expected build artefacts exist
        run: |
          test -f _site/index.html
          test -f _site/latest.html
          test -f _site/archive/index.html
          test -f _site/search.html
          test -f _site/search-index.json
          test -f _site/manifest.json
          test -f _site/feed.xml
          test -f _site/assets/cryptopulse.css
          test -f _site/assets/cryptopulse-report-ux.css
          test -f _site/assets/cryptopulse-report-ux.js
          test -f _site/assets/cryptopulse-brief-glance.css
          test -f _site/assets/cryptopulse-structured-sources.css
          test -f _site/assets/cryptopulse-search-filters.css
          test -f _site/assets/cryptopulse-accessibility.css
