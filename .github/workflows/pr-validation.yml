name: Validate CryptoPulse PR

on:
  pull_request:
    branches:
      - main
    paths:
      - "**/*.md"
      - "reports/crypto/hourly/**/*.md"
      - "site/**"
      - "site_generator/**"
      - "scripts/**"
      - ".github/workflows/**"
      - ".github/issueops-workflow-dispatch.yml"
      - "docs/**"
      - "planning/**"
      - "README.md"
      - "tests/**"
      - "config/**"

permissions:
  contents: read
  attestations: read

concurrency:
  group: cryptopulse-pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build site and check generated output
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml markdown

      - name: Diagnose recovery-v2 bundle transport encoding
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: 5f813fcf1600be6e2ea65908d8e2c20d1f0682f2
          PREDICATE_TYPE: https://github.com/8ft0-ai/crypto-pulse/issueops/dispatch-attestation/v1
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from issueops_dispatch import protected_dispatch, target_guard
          from issueops_dispatch.core import canonical_json_bytes

          source_sha = os.environ["SOURCE_SHA"]
          authorisation_id = "phase9-gpt-oss-quality-recovery-20260814-v2"
          registry = json.loads(Path(".github/issueops-workflow-dispatch.yml").read_text(encoding="utf-8"))
          record = next(
              item for item in registry["authorisations"]
              if item["authorisation_id"] == authorisation_id
          )
          execution_ref = f"refs/tags/issueops/dispatch/{authorisation_id}--sha-{source_sha}"
          resolution = target_guard.build_resolution(
              record=record,
              source_sha=source_sha,
              execution_ref=execution_ref,
          )
          subject = protected_dispatch.canonical_subject_main(
              resolution=resolution,
              target_run={"id": 31772966775},
          )
          Path(os.environ["RUNNER_TEMP"], "recovery-v2-subject.json").write_bytes(
              canonical_json_bytes(subject)
          )
          PY

          asset="gh_2.97.0_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/cli/cli/releases/download/v2.97.0/$asset" \
            --output "$RUNNER_TEMP/$asset"
          python -m issueops_dispatch.target_guard_main verify-asset \
            --asset "$RUNNER_TEMP/$asset"
          mkdir -p "$RUNNER_TEMP/gh-2.97.0"
          tar -xzf "$RUNNER_TEMP/$asset" --strip-components=1 \
            -C "$RUNNER_TEMP/gh-2.97.0"
          gh_bin="$RUNNER_TEMP/gh-2.97.0/bin/gh"

          subject_digest="$(sha256sum "$RUNNER_TEMP/recovery-v2-subject.json" | awk '{print $1}')"
          bundle_url="$(
            "$gh_bin" api --method GET \
              "/repos/$GITHUB_REPOSITORY/attestations/sha256:$subject_digest" \
              -f predicate_type="$PREDICATE_TYPE" \
              -F per_page=100 \
              --jq '.attestations[0].bundle_url'
          )"
          test -n "$bundle_url"

          curl --fail --location --silent --show-error "$bundle_url" \
            --output "$RUNNER_TEMP/raw-bundle"
          curl --compressed --fail --location --silent --show-error "$bundle_url" \
            --output "$RUNNER_TEMP/decoded-bundle.json"
          echo "DIAGNOSTIC_RAW_PREFIX=$(od -An -tx1 -N4 "$RUNNER_TEMP/raw-bundle" | tr -d ' \n')"
          echo "DIAGNOSTIC_DECODED_PREFIX=$(od -An -tx1 -N4 "$RUNNER_TEMP/decoded-bundle.json" | tr -d ' \n')"
          echo "DIAGNOSTIC_RAW_BYTES=$(wc -c < "$RUNNER_TEMP/raw-bundle")"
          echo "DIAGNOSTIC_DECODED_BYTES=$(wc -c < "$RUNNER_TEMP/decoded-bundle.json")"

          set +e
          "$gh_bin" attestation verify \
            "$RUNNER_TEMP/recovery-v2-subject.json" \
            --bundle "$RUNNER_TEMP/decoded-bundle.json" \
            --repo "$GITHUB_REPOSITORY" \
            --cert-oidc-issuer "https://token.actions.githubusercontent.com" \
            --signer-workflow "8ft0-ai/crypto-pulse/.github/workflows/issueops-workflow-dispatch.yml" \
            --signer-digest "$SOURCE_SHA" \
            --source-digest "$SOURCE_SHA" \
            --source-ref "refs/heads/main" \
            --predicate-type "$PREDICATE_TYPE" \
            --deny-self-hosted-runners \
            --format json \
            >"$RUNNER_TEMP/recovery-v2-verify.stdout" \
            2>"$RUNNER_TEMP/recovery-v2-verify.stderr"
          status=$?
          set -e
          echo "DIAGNOSTIC_DECODED_VERIFY_EXIT=$status"
          sed -E \
            's/(gh[ops]_[A-Za-z0-9_]+|github_pat_[A-Za-z0-9_]+)/***MASKED***/g' \
            "$RUNNER_TEMP/recovery-v2-verify.stderr"
          exit 1

      - name: Run semantic-plan benchmark integration tests
        run: |
          python -m unittest tests.test_semantic_plan_benchmark -v

      - name: Run public-data policy compatibility tests
        run: |
          python -m unittest \
            tests.test_llm_public_data_demo \
            tests.test_llm_public_demo_diagnostic \
            -v

      - name: Run unit tests
        run: |
          set -o pipefail
          python -m unittest discover -s tests 2>&1 | tee unit-test-output.txt

      - name: Upload unit-test failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: unit-test-output.txt
          if-no-files-found: error
          retention-days: 7

      - name: Validate documentation
        run: |
          python scripts/validate_documentation.py

      - name: Reject committed generated site output
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '^_site/'; then
            echo "Generated _site/ output must not be committed. Build output is disposable and produced by GitHub Actions." >&2
            exit 1
          fi

      - name: Build static site
        run: |
          python -m site_generator

      - name: Verify expected build artefacts exist
        run: |
          test -f _site/index.html
          test -f _site/latest.html
          test -f _site/archive/index.html
          test -f _site/search.html
          test -f _site/search-index.json
          test -f _site/manifest.json
          test -f _site/feed.xml
          test -f _site/assets/cryptopulse.css
          test -f _site/assets/cryptopulse-report-ux.css
          test -f _site/assets/cryptopulse-report-ux.js
          test -f _site/assets/cryptopulse-brief-glance.css
          test -f _site/assets/cryptopulse-structured-sources.css
          test -f _site/assets/cryptopulse-search-filters.css
          test -f _site/assets/cryptopulse-accessibility.css