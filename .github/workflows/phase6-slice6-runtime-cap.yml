name: Apply Slice 6 request cap

on:
  push:
    branches:
      - agent/phase-6-slice-6-model-selection-comparison

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-6-slice-6-model-selection-comparison
      - name: Raise only the bounded-selector request-byte ceiling
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('llm_analysis/candidate_selection_model_comparison.py')
          source = path.read_text()
          old = '        max_output_tokens=512,\n        max_cost_usd=model.maximum_generation_cost_usd,\n'
          new = '        max_output_tokens=512,\n        max_request_bytes=5_000_000,\n        max_cost_usd=model.maximum_generation_cost_usd,\n'
          if source.count(old) != 1:
              raise SystemExit('expected runtime overlay marker exactly once')
          path.write_text(source.replace(old, new, 1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add llm_analysis/candidate_selection_model_comparison.py
          git commit -m 'Allow complete canonical selector catalogues'
          git push
