name: Reconcile Phase 8 transport run

on:
  pull_request:
    paths:
      - .github/workflows/reconcile-phase-8-transport-run.yml

permissions:
  actions: read
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - name: Query exact issue-comment workflow run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_SHA: 6db61d5307a51ba04507c29d39ea72f026b7d9fc
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request

          url = (
              f"https://api.github.com/repos/{os.environ['REPOSITORY']}"
              "/actions/workflows/governed-openrouter-transport-calibration.yml/runs"
              "?event=issue_comment&per_page=20"
          )
          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "cryptopulse-phase8-run-reconciliation",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)
          matches = [
              {
                  "id": row.get("id"),
                  "name": row.get("name"),
                  "event": row.get("event"),
                  "status": row.get("status"),
                  "conclusion": row.get("conclusion"),
                  "head_sha": row.get("head_sha"),
                  "run_number": row.get("run_number"),
                  "created_at": row.get("created_at"),
                  "updated_at": row.get("updated_at"),
                  "html_url": row.get("html_url"),
              }
              for row in payload.get("workflow_runs", [])
              if row.get("head_sha") == os.environ["EXPECTED_SHA"]
          ]
          print("PHASE8_RUN_MATCHES=" + json.dumps(matches, sort_keys=True))
          if len(matches) != 1:
              raise SystemExit(f"expected one exact Phase 8 run, found {len(matches)}")
          PY
