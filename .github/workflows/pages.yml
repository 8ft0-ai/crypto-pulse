name: Publish CryptoPulse Pages

on:
  push:
    branches:
      - main
    paths:
      - "reports/crypto/hourly/**/*.md"
      - "site/**"
      - "scripts/build_pages_site.py"
      - "scripts/build_pages_site_with_search.py"
      - "scripts/build_pages_site_mobile_ux.py"
      - "scripts/build_pages_site_brief_glance.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: crypto-pulse-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml markdown

      - name: Build static site
        run: |
          python scripts/build_pages_site_brief_glance.py

      - name: Upload GitHub Pages artefact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
