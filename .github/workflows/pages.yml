name: Publish CryptoPulse Pages

on:
  push:
    branches:
      - main
    paths:
      - "reports/crypto/hourly/**/*.md"
      - "site/**"
      - "site_generator/**"
      - "scripts/build_pages_site.py"
      - "scripts/build_pages_site_with_search.py"
      - "scripts/build_pages_site_mobile_ux.py"
      - "scripts/build_pages_site_brief_glance.py"
      - "scripts/build_pages_site_search_filters.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: crypto-pulse-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml markdown

      - name: Build static site
        run: |
          python -m site_generator

      - name: Upload GitHub Pages artefact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    name: Verify deployed site
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out exact deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js for Axe
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install browser verification dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          npm install --no-save axe-core@4.10.3
          python -m playwright install --with-deps chromium

      - name: Run live-site verification
        env:
          CRYPTOPULSE_BASE_URL: https://8ft0-ai.github.io/crypto-pulse/
          DEPLOYMENT_COMMIT: ${{ github.sha }}
          EVIDENCE_DIR: live-site-evidence
          AXE_PATH: node_modules/axe-core/axe.min.js
        run: python -m site_verification.live_pages

      - name: Publish verification summary
        if: always()
        env:
          CRYPTOPULSE_BASE_URL: https://8ft0-ai.github.io/crypto-pulse/
          DEPLOYMENT_COMMIT: ${{ github.sha }}
          EVIDENCE_DIR: live-site-evidence
        run: python -m site_verification.actions_summary

      - name: Upload live-site evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cryptopulse-live-site-evidence
          path: live-site-evidence/
          if-no-files-found: error
          retention-days: 30
