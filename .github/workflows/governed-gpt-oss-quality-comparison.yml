name: Governed GPT-OSS quality comparison

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: governed-gpt-oss-quality-comparison
  cancel-in-progress: false

jobs:
  guard:
    name: Verify protected IssueOps dispatch provenance
    if: ${{ github.run_attempt == 1 }}
    permissions:
      contents: read
      actions: read
      attestations: read
    runs-on: ubuntu-latest
    steps:
      - name: Reject non-canonical protected execution context
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/tags/issueops/dispatch/*--sha-* ]]; then
            echo "This protected target requires an IssueOps execution tag." >&2
            exit 1
          fi
          if [[ ! "$GITHUB_REF" =~ ^refs/tags/issueops/dispatch/[A-Za-z0-9._-]{1,48}--sha-[0-9a-f]{40}$ ]]; then
            echo "Execution ref does not satisfy the canonical IssueOps grammar." >&2
            exit 1
          fi
          if [[ "$WORKFLOW_SHA" != "$GITHUB_SHA" ]]; then
            echo "The workflow definition is not sourced from the execution SHA." >&2
            exit 1
          fi
          if [[ "$(uname -m)" != "x86_64" ]]; then
            echo "The frozen gh verifier is authorised only on GitHub-hosted Linux x64." >&2
            exit 1
          fi

      - name: Check out exact protected execution SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact protected checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up frozen Python action
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install pinned GitHub attestation verifier
        id: verifier
        shell: bash
        run: |
          set -euo pipefail
          asset="gh_2.97.0_linux_amd64.tar.gz"
          expected="a2c9b8497e1f85b1ad0dfcb78b5a622e098801b8e461e459e88e1ee12f018112"
          url="https://github.com/cli/cli/releases/download/v2.97.0/$asset"
          curl --fail --location --silent --show-error "$url" --output "$RUNNER_TEMP/$asset"
          printf '%s  %s\n' "$expected" "$RUNNER_TEMP/$asset" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gh-2.97.0"
          tar -xzf "$RUNNER_TEMP/$asset" --strip-components=1 -C "$RUNNER_TEMP/gh-2.97.0"
          test -x "$RUNNER_TEMP/gh-2.97.0/bin/gh"
          "$RUNNER_TEMP/gh-2.97.0/bin/gh" --version | head -n1 | grep -F 'gh version 2.97.0 '
          echo "path=$RUNNER_TEMP/gh-2.97.0/bin/gh" >> "$GITHUB_OUTPUT"

      - name: Verify canonical signed dispatcher receipt
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python -m issueops_dispatch.target_guard \
            --repository-root . \
            --gh-bin "${{ steps.verifier.outputs.path }}" \
            --output "$RUNNER_TEMP/issueops-target-provenance.json"

      - name: Verify frozen dispatcher workflow content
        env:
          PROVENANCE_PATH: ${{ runner.temp }}/issueops-target-provenance.json
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          from issueops_dispatch.core import validate_registry
          from issueops_dispatch.runner import load_registry

          proof = json.loads(Path("${{ runner.temp }}/issueops-target-provenance.json").read_text(encoding="utf-8"))
          registry = load_registry(Path(".github/issueops-workflow-dispatch.yml"))
          records = validate_registry(registry, now=datetime.now(timezone.utc))
          matches = [record for record in records if record["authorisation_id"] == proof["authorisation_id"]]
          if len(matches) != 1:
              raise SystemExit("provenance authorisation is no longer unique")
          expected = matches[0]["dispatcher_workflow_sha256"]
          actual = hashlib.sha256(Path(".github/workflows/issueops-workflow-dispatch.yml").read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit("dispatcher workflow content does not match frozen authority")
          PY

      - name: Publish provenance summary
        if: success()
        shell: bash
        run: |
          {
            echo "# Protected IssueOps provenance"
            echo
            echo "The exact execution tag, ruleset, target/dispatcher source snapshot, signed dispatcher receipt, certificate identity, dispatcher actor/run and rerun boundary were verified before protected execution eligibility."
          } >> "$GITHUB_STEP_SUMMARY"

  prepare:
    name: Freeze Phase 9 corpus and deterministic comparator
    needs: guard
    if: ${{ github.run_attempt == 1 && needs.guard.result == 'success' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      trusted_sha: ${{ steps.trusted.outputs.sha }}
    steps:
      - name: Check out exact authorised source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Record exact authorised commit
        id: trusted
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          test "$sha" = "$GITHUB_SHA"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install runtime dependency
        run: pip install pyyaml markdown

      - name: Regenerate and freeze Phase 9 preparation
        shell: bash
        run: |
          set -euo pipefail
          python -m llm_analysis.gpt_oss_quality_comparison_runner prepare \
            --repository-root . \
            --config config/gpt-oss-quality-comparison.yml \
            --output-dir "$RUNNER_TEMP/gpt-oss-quality-comparison-prepared"

      - name: Upload prepared corpus
        uses: actions/upload-artifact@v4
        with:
          name: gpt-oss-quality-comparison-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gpt-oss-quality-comparison-prepared/
          if-no-files-found: error
          retention-days: 7

  compare:
    name: Run protected Phase 9 comparison
    needs: [guard, prepare]
    if: ${{ github.run_attempt == 1 && needs.guard.result == 'success' && needs.prepare.result == 'success' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: governed-llm-dry-run
    steps:
      - name: Check out exact authorised commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.trusted_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify trusted commit
        env:
          TRUSTED_SHA: ${{ needs.prepare.outputs.trusted_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$TRUSTED_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$TRUSTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install runtime dependency
        run: pip install pyyaml markdown

      - name: Download prepared corpus
        uses: actions/download-artifact@v4
        with:
          name: gpt-oss-quality-comparison-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gpt-oss-quality-comparison-prepared

      - name: Execute exact GPT-OSS/DeepInfra comparison
        id: comparison
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TRUSTED_SHA: ${{ needs.prepare.outputs.trusted_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python -m llm_analysis.gpt_oss_quality_comparison_runner run \
            --repository-root . \
            --config config/gpt-oss-quality-comparison.yml \
            --prepared-dir "$RUNNER_TEMP/gpt-oss-quality-comparison-prepared" \
            --output-dir "$RUNNER_TEMP/gpt-oss-quality-comparison" \
            --trusted-main-sha "$TRUSTED_SHA"

      - name: Publish protected comparison summary
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/gpt-oss-quality-comparison/actions-summary.md" ]]; then
            cat "$RUNNER_TEMP/gpt-oss-quality-comparison/actions-summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "# Phase 9 GPT-OSS quality comparison" >> "$GITHUB_STEP_SUMMARY"
            echo "Execution failed before a complete diagnostic summary was produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload protected Phase 9 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpt-oss-quality-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gpt-oss-quality-comparison/
          if-no-files-found: warn
          retention-days: 30

      - name: Fail when the protected runner did not complete
        if: steps.comparison.outcome != 'success'
        shell: bash
        run: |
          echo "The protected Phase 9 runner did not complete. Review retained evidence." >&2
          exit 1
