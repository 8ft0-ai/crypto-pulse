name: Apply Phase 9 implementation patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-reviewed-patch:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feature/352-gpt-oss-quality-comparison'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact implementation branch
        uses: actions/checkout@v4
        with:
          ref: feature/352-gpt-oss-quality-comparison
          fetch-depth: 1
          persist-credentials: true

      - name: Verify and apply exact implementation patch
        shell: bash
        run: |
          set -euo pipefail

          echo 'e890f33eec9fb975caef3e747cbf641a7cb003227628f086ad9059e2500b1dae  .github/phase9-patch.part00' | sha256sum --check --strict
          echo 'c7d3ca50e3de6fcc7e20c4a4b532bf70fd61f7943d7a53a8f83d74816505e6b2  .github/phase9-patch.part01' | sha256sum --check --strict
          echo 'b73a3ececadceee83bc833071feb93030f6c57fe243002280fef2ba6c111fabe  .github/phase9-patch.part02' | sha256sum --check --strict
          echo '0fe770f8f79f74aa5054633e33d1d16e46bc72973b4bce682cd600afb4d08d0e  .github/phase9-patch.part03mid' | sha256sum --check --strict
          echo 'a33b72106788bec87e1e64f7a20c41125ad062ea7b6211bcde12005419d5c693  .github/phase9-implementation.patch.gz.b64' | sha256sum --check --strict

          cat \
            .github/phase9-patch.part00 \
            .github/phase9-patch.part01 \
            .github/phase9-patch.part02 \
            .github/phase9-patch.part03mid \
            > /tmp/phase9-implementation.patch.gz.b64
          tail -c 10000 .github/phase9-implementation.patch.gz.b64 >> /tmp/phase9-implementation.patch.gz.b64
          echo '709e435ae30ef5307a5b05aacc10650e9bba91a42ea4ce77d32c30a0ba482f0d  /tmp/phase9-implementation.patch.gz.b64' | sha256sum --check --strict

          base64 --decode /tmp/phase9-implementation.patch.gz.b64 | gzip --decompress > /tmp/phase9-implementation.patch
          echo 'ebb840b8559fbdb48b4614d0cd65e3858bd3aa76ff5e2cec53b203cfb6d8e7c1  /tmp/phase9-implementation.patch' | sha256sum --check --strict

          # The reviewed patch deletes the original source-export workflow. Restore
          # that exact pre-applicator content so the deletion hunk remains grounded.
          python - <<'PY'
          from pathlib import Path

          content = """name: Phase 9 source export

          on:
            pull_request:
              branches:
                - main

          permissions:
            contents: read

          jobs:
            export-source:
              if: >-
                github.event.pull_request.head.repo.full_name == github.repository &&
                github.head_ref == 'feature/352-gpt-oss-quality-comparison'
              runs-on: ubuntu-latest
              steps:
                - name: Check out exact pull request head
                  uses: actions/checkout@v4

                - name: Export checked-out source for implementation validation
                  uses: actions/upload-artifact@v4
                  with:
                    name: phase9-source-export-__GITHUB_SHA_EXPRESSION__
                    path: |
                      .
                      !.git
                      !_site
                    include-hidden-files: true
                    retention-days: 1
                    if-no-files-found: error
          """
          content = content.replace('__GITHUB_SHA_EXPRESSION__', '$' + '{{ github.sha }}')
          Path('.github/workflows/phase9-source-export.yml').write_text(content, encoding='utf-8')
          PY

          git apply --check /tmp/phase9-implementation.patch
          git apply /tmp/phase9-implementation.patch
          rm -f \
            .github/phase9-implementation.patch.gz.b64 \
            .github/phase9-patch.part00 \
            .github/phase9-patch.part01 \
            .github/phase9-patch.part02 \
            .github/phase9-patch.part03mid

          git add -A
          cat > /tmp/expected-files <<'EXPECTED_FILES'
          .github/phase9-implementation.patch.gz.b64
          .github/phase9-patch.part00
          .github/phase9-patch.part01
          .github/phase9-patch.part02
          .github/phase9-patch.part03mid
          .github/workflows/governed-gpt-oss-quality-comparison.yml
          .github/workflows/phase9-source-export.yml
          config/gpt-oss-quality-comparison.yml
          docs/index.md
          docs/reference/gpt-oss-quality-comparison.md
          evaluation/phase-09/gpt-oss-quality-comparison/README.md
          evaluation/phase-09/gpt-oss-quality-comparison/scoring-contract.md
          llm_analysis/gpt_oss_quality_comparison.py
          llm_analysis/gpt_oss_quality_comparison_config.py
          llm_analysis/gpt_oss_quality_comparison_runner.py
          llm_analysis/gpt_oss_quality_comparison_scoring.py
          tests/test_governed_gpt_oss_quality_comparison_workflow.py
          tests/test_gpt_oss_quality_comparison.py
          EXPECTED_FILES
          git diff --cached --name-only | sort > /tmp/actual-files
          sort -o /tmp/expected-files /tmp/expected-files
          diff --unified /tmp/expected-files /tmp/actual-files
          git diff --cached --check

      - name: Commit exact implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Implement Phase 9 GPT-OSS quality comparison'
          git push origin HEAD:feature/352-gpt-oss-quality-comparison
