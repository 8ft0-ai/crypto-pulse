name: Ingest Crypto Sources

on:
  workflow_dispatch:
  schedule:
    # GitHub cron schedules are UTC. The ingestion script writes Australia/Sydney
    # local timestamps into the snapshot path and run metadata.
    - cron: "17 * * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: crypto-source-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    name: Fetch source snapshot and open PR
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Fetch source data
        id: ingest
        run: |
          set -euo pipefail
          snapshot_path="$(python scripts/ingest_crypto_sources.py \
            --config config/crypto_sources.yml \
            --output-root data/crypto/hourly \
            --timezone Australia/Sydney)"

          if [[ -z "$snapshot_path" ]]; then
            echo "Ingestion script did not report a snapshot path." >&2
            exit 1
          fi

          echo "snapshot_path=$snapshot_path" >> "$GITHUB_OUTPUT"
          echo "Generated source snapshot: $snapshot_path"

      - name: Validate source snapshot
        env:
          SNAPSHOT_PATH: ${{ steps.ingest.outputs.snapshot_path }}
        run: |
          set -euo pipefail
          python scripts/validate_crypto_snapshot.py "$SNAPSHOT_PATH"

      - name: Build PR evidence
        id: evidence
        env:
          SNAPSHOT_PATH: ${{ steps.ingest.outputs.snapshot_path }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path

          snapshot_path = Path(os.environ["SNAPSHOT_PATH"])
          snapshot = json.loads(snapshot_path.read_text(encoding="utf-8"))

          def bullet_list(values: list[str]) -> str:
              if not values:
                  return "- None recorded."
              return "\n".join(f"- {value}" for value in values)

          source_lines = []
          for name, payload in sorted(snapshot.get("sources", {}).items()):
              status = payload.get("status", "unknown")
              fetched_at = payload.get("fetched_at_utc", "not recorded")
              source_lines.append(f"- `{name}`: `{status}` at `{fetched_at}`")

          warnings = [str(item) for item in snapshot.get("warnings", [])]
          errors = [str(item) for item in snapshot.get("errors", [])]
          run_url = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"

          body = f"""## Summary

          Adds a scheduled crypto source snapshot generated by GitHub Actions.

          Snapshot path:

          ```text
          {snapshot_path.as_posix()}
          ```

          ## Source status

          {chr(10).join(source_lines) if source_lines else "- No source statuses recorded."}

          ## Warnings

          {bullet_list(warnings)}

          ## Errors

          {bullet_list(errors)}

          ## Verification

          - Ran `python scripts/ingest_crypto_sources.py --config config/crypto_sources.yml --output-root data/crypto/hourly --timezone Australia/Sydney`.
          - Ran `python scripts/validate_crypto_snapshot.py {snapshot_path.as_posix()}`.
          - Committed only generated source snapshots under `data/crypto/hourly/...`.
          - Did not commit generated `_site/` output.

          ## Scope limitations

          - This PR adds source evidence only.
          - This PR does not generate a Markdown market report.
          - This PR does not call an LLM.
          - This PR does not auto-merge.

          Workflow run: {run_url}
          """

          body = "\n".join(line.strip() for line in body.strip().splitlines()) + "\n"
          Path("pr-body.md").write_text(body, encoding="utf-8")

          title = f"Add crypto source snapshot {snapshot_path.stem}"
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"pr_title={title}\n")
          PY

      - name: Commit snapshot and open PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_TITLE: ${{ steps.evidence.outputs.pr_title }}
          SNAPSHOT_PATH: ${{ steps.ingest.outputs.snapshot_path }}
        run: |
          set -euo pipefail

          if [[ -z "$(git status --porcelain -- data/crypto/hourly)" ]]; then
            echo "No generated source snapshot changes to commit."
            exit 0
          fi

          unexpected_changes="$(git status --porcelain --untracked-files=all | awk '$2 !~ /^data\/crypto\/hourly\// { print }')"
          if [[ -n "$unexpected_changes" ]]; then
            echo "Unexpected working tree changes detected:" >&2
            echo "$unexpected_changes" >&2
            exit 1
          fi

          branch="automation/crypto-source-ingestion-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add data/crypto/hourly
          git commit -m "Add crypto source snapshot"
          git push --set-upstream origin "$branch"

          gh pr create \
            --title "$PR_TITLE" \
            --body-file pr-body.md \
            --base main \
            --head "$branch"
