name: Clean duplicate Slice 5 import

on:
  push:
    branches:
      - agent/phase-6-slice-5-bounded-candidate-selection

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-6-slice-5-bounded-candidate-selection
      - name: Remove duplicate validation-fixture import
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('llm_analysis/candidate_selection_evaluation.py')
          source = path.read_text()
          duplicate = (
              'from .candidate_selection_validation_proof import validation_matrix\n'
              'from .candidate_selection_validation_proof import validation_matrix\n'
          )
          if source.count(duplicate) != 1:
              raise SystemExit('expected duplicate import not found exactly once')
          path.write_text(source.replace(
              duplicate,
              'from .candidate_selection_validation_proof import validation_matrix\n',
              1,
          ))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add llm_analysis/candidate_selection_evaluation.py
          git commit -m 'Remove duplicate selector validation import'
          git push
