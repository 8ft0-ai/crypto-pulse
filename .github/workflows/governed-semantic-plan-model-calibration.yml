name: Governed semantic plan model calibration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: governed-semantic-plan-model-calibration-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  guard:
    name: Require trusted main dispatch
    runs-on: ubuntu-latest
    steps:
      - name: Reject non-main workflow refs
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "This workflow must be dispatched from the main branch." >&2
            exit 1
          fi

  prepare:
    name: Freeze semantic calibration corpus
    needs: guard
    runs-on: ubuntu-latest
    outputs:
      trusted_sha: ${{ steps.trusted.outputs.sha }}
    steps:
      - name: Check out trusted main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Record trusted main commit
        id: trusted
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependency
        run: pip install pyyaml

      - name: Validate and freeze the existing semantic corpus
        shell: bash
        run: |
          set -euo pipefail
          python -m llm_analysis.semantic_plan_model_evaluation prepare \
            --repository-root . \
            --config config/semantic-plan-model-selection.yml \
            --output-dir "$RUNNER_TEMP/semantic-plan-model-calibration-prepared"

      - name: Upload prepared corpus
        uses: actions/upload-artifact@v4
        with:
          name: semantic-plan-model-calibration-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/semantic-plan-model-calibration-prepared/
          if-no-files-found: error
          retention-days: 7

  calibrate:
    name: Run protected full-contract calibration
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: governed-llm-dry-run
    steps:
      - name: Check out exact trusted main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.trusted_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify trusted commit
        env:
          TRUSTED_SHA: ${{ needs.prepare.outputs.trusted_sha }}
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$TRUSTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependency
        run: pip install pyyaml

      - name: Download prepared corpus
        uses: actions/download-artifact@v4
        with:
          name: semantic-plan-model-calibration-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/semantic-plan-model-calibration-prepared

      - name: Run three-call model calibration
        id: calibration
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TRUSTED_SHA: ${{ needs.prepare.outputs.trusted_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python -m llm_analysis.semantic_plan_model_calibration \
            --repository-root . \
            --config config/semantic-plan-model-calibration.yml \
            --prepared-dir "$RUNNER_TEMP/semantic-plan-model-calibration-prepared" \
            --output-dir "$RUNNER_TEMP/semantic-plan-model-calibration" \
            --trusted-main-sha "$TRUSTED_SHA"

      - name: Publish calibration summary
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/semantic-plan-model-calibration/actions-summary.md" ]]; then
            cat "$RUNNER_TEMP/semantic-plan-model-calibration/actions-summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "# Semantic claim-plan route calibration" >> "$GITHUB_STEP_SUMMARY"
            echo "Calibration failed before a complete summary was produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload protected calibration artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-plan-model-calibration-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/semantic-plan-model-calibration/
          if-no-files-found: warn
          retention-days: 30

      - name: Fail when calibration infrastructure failed
        if: steps.calibration.outcome != 'success'
        shell: bash
        run: |
          echo "The controlled calibration did not complete. Review retained diagnostics." >&2
          exit 1
