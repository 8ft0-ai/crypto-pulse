name: Apply compact Slice 6 transport patch

on:
  push:
    branches:
      - agent/correct-phase-6-slice-6-provider-transport

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/correct-phase-6-slice-6-provider-transport
      - name: Patch comparison configuration and evaluator
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(source, old, new, label):
              if source.count(old) != 1:
                  raise SystemExit(f'{label}: expected one match, found {source.count(old)}')
              return source.replace(old, new, 1)

          path = Path('llm_analysis/candidate_selection_model_comparison_config.py')
          source = path.read_text()
          source = replace_once(source,
              '    maximum_model_cost_usd: float\n    send_temperature: bool\n',
              '    maximum_model_cost_usd: float\n    max_output_tokens: int\n    send_temperature: bool\n',
              'model dataclass')
          source = replace_once(source,
              '    maximum_semantic_repairs_per_run: int\n    maximum_total_cost_usd: float\n',
              '    maximum_semantic_repairs_per_run: int\n    maximum_fallbacks_before_decisive_failure: int\n    maximum_total_cost_usd: float\n',
              'plan dataclass')
          source = replace_once(source,
              '            "maximum_semantic_repairs_per_run",\n            "maximum_total_cost_usd",\n',
              '            "maximum_semantic_repairs_per_run",\n            "maximum_fallbacks_before_decisive_failure",\n            "maximum_total_cost_usd",\n',
              'top-level keys')
          source = replace_once(source,
              '        "maximum_model_cost_usd",\n        "send_temperature",\n',
              '        "maximum_model_cost_usd",\n        "max_output_tokens",\n        "send_temperature",\n',
              'model keys')
          source = replace_once(source,
              '            maximum_model_cost_usd=_number(\n                row.get("maximum_model_cost_usd"),\n                f"models[{index}].maximum_model_cost_usd",\n                0.000001,\n                10.0,\n            ),\n            send_temperature=_bool(',
              '            maximum_model_cost_usd=_number(\n                row.get("maximum_model_cost_usd"),\n                f"models[{index}].maximum_model_cost_usd",\n                0.000001,\n                10.0,\n            ),\n            max_output_tokens=_integer(\n                row.get("max_output_tokens"),\n                f"models[{index}].max_output_tokens",\n                512,\n                1024,\n            ),\n            send_temperature=_bool(',
              'model parse')
          source = replace_once(source,
              '        models.append(model_row)\n',
              '        expected_output = 1024 if role == "quality_benchmark" else 512\n        if model_row.max_output_tokens != expected_output:\n            raise EvaluationConfigurationError(\n                f"{key} max_output_tokens must be {expected_output}"\n            )\n        models.append(model_row)\n',
              'model output contract')
          source = replace_once(source,
              '    planned_logical = sum(item.repeats_per_case * 5 for item in models)\n',
              '    maximum_fallbacks = _integer(\n        raw.get("maximum_fallbacks_before_decisive_failure"),\n        "maximum_fallbacks_before_decisive_failure",\n        2,\n        2,\n    )\n    planned_logical = sum(item.repeats_per_case * 5 for item in models)\n',
              'fallback parse')
          source = replace_once(source,
              '    maximum_total_cost = _number(\n        raw.get("maximum_total_cost_usd"), "maximum_total_cost_usd", 4.0, 4.0\n    )\n',
              '    maximum_total_cost = _number(\n        raw.get("maximum_total_cost_usd"), "maximum_total_cost_usd", 5.0, 5.0\n    )\n',
              'total cost')
          source = replace_once(source,
              '        maximum_semantic_repairs_per_run=maximum_repairs,\n        maximum_total_cost_usd=maximum_total_cost,\n',
              '        maximum_semantic_repairs_per_run=maximum_repairs,\n        maximum_fallbacks_before_decisive_failure=maximum_fallbacks,\n        maximum_total_cost_usd=maximum_total_cost,\n',
              'plan return')
          path.write_text(source)

          path = Path('llm_analysis/candidate_selection_model_comparison.py')
          source = path.read_text()
          source = replace_once(source,
              'from .candidate_selection_model_scoring import (\n',
              'from .compact_candidate_selector_client import CompactCandidateSelectorClient\nfrom .candidate_selection_model_scoring import (\n',
              'compact import')
          source = replace_once(source,
              '            "maximum_semantic_repairs_per_run": plan.maximum_semantic_repairs_per_run,\n            "maximum_total_cost_usd": plan.maximum_total_cost_usd,\n',
              '            "maximum_semantic_repairs_per_run": plan.maximum_semantic_repairs_per_run,\n            "maximum_fallbacks_before_decisive_failure": plan.maximum_fallbacks_before_decisive_failure,\n            "maximum_total_cost_usd": plan.maximum_total_cost_usd,\n',
              'prepared limits')
          source = replace_once(source,
              '        max_output_tokens=512,\n',
              '        max_output_tokens=model.max_output_tokens,\n',
              'model output runtime')
          source = replace_once(source,
              '                client = OpenRouterCandidateSelectorClient(\n',
              '                provider_client = OpenRouterCandidateSelectorClient(\n',
              'provider client rename')
          source = replace_once(source,
              '                    after_provider_call=lambda actual, current=model: ledger.add(current, actual),\n                )\n                result = run_bounded_candidate_selector(\n',
              '                    after_provider_call=lambda actual, current=model: ledger.add(current, actual),\n                )\n                client = CompactCandidateSelectorClient(provider_client)\n                result = run_bounded_candidate_selector(\n',
              'compact wrapper')
          source = replace_once(source,
              '                provider_calls = [item.protected_dict() for item in client.call_records]\n',
              '                provider_calls = [item.protected_dict() for item in provider_client.call_records]\n',
              'provider records')
          source = replace_once(source,
              '                    "provider_calls": _safe_provider_calls(provider_calls),\n',
              '                    "provider_calls": _safe_provider_calls(provider_calls),\n                    "compact_request_id": client.compact_requests[-1]["compact_request_id"],\n                    "compact_request_sha256": content_sha256(client.compact_requests[-1]),\n',
              'compact evidence')
          path.write_text(source)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add llm_analysis/candidate_selection_model_comparison_config.py llm_analysis/candidate_selection_model_comparison.py
          git commit -m 'Use compact calibrated Slice 6 provider transport'
          git push
