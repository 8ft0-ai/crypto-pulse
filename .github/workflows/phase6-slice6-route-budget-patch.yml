name: Apply Slice 6 route-budget invariant

on:
  push:
    branches:
      - agent/correct-phase-6-slice-6-provider-transport

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/correct-phase-6-slice-6-provider-transport
      - name: Require model ceiling to cover route and corpus calls
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('llm_analysis/candidate_selection_model_comparison_config.py')
          source = path.read_text()
          old = '''        minimum_model_ceiling = (
            model_row.repeats_per_case
            * 5
            * 2
            * model_row.maximum_generation_cost_usd
        )
'''
          new = '''        minimum_model_ceiling = (
            (1 + model_row.repeats_per_case * 5 * 2)
            * model_row.maximum_generation_cost_usd
        )
'''
          if source.count(old) != 1:
              raise SystemExit('model ceiling expression missing')
          path.write_text(source.replace(old, new, 1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add llm_analysis/candidate_selection_model_comparison_config.py
          git commit -m 'Include route probe in model budget invariant'
          git push
