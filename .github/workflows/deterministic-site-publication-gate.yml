name: Deterministic Site Publication Gate

on:
  workflow_run:
    workflows:
      - Validate CryptoPulse PR
    types:
      - completed

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read

concurrency:
  group: deterministic-site-publication-gate
  cancel-in-progress: false

jobs:
  preflight:
    name: Reconstruct immutable publication eligibility
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'automation/deterministic-publication-')
    runs-on: ubuntu-latest
    outputs:
      eligible: ${{ steps.policy.outputs.eligible }}
      pr_number: ${{ steps.identity.outputs.pr_number }}
      candidate_head_sha: ${{ steps.identity.outputs.candidate_head_sha }}
      main_base_sha: ${{ steps.identity.outputs.main_base_sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      ACTIVATION: ${{ vars.DETERMINISTIC_PUBLICATION_ACTIVATION || 'disabled' }}
      PILOT_RUN_ID: ${{ vars.DETERMINISTIC_PUBLICATION_PILOT_RUN_ID || '' }}
      PILOT_RUN_NUMBER: ${{ vars.DETERMINISTIC_PUBLICATION_PILOT_RUN_NUMBER || '' }}

    steps:
      - name: Check out trusted default-branch policy only
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve trusted generation identity
        id: branch
        env:
          CANDIDATE_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          python scripts/deterministic_site_publication.py branch-identity \
            --branch "$CANDIDATE_BRANCH" \
            --github-output "$GITHUB_OUTPUT"

      - name: Fetch immutable attestation and repository metadata
        id: metadata
        env:
          GENERATION_RUN_ID: ${{ steps.branch.outputs.generation_workflow_run_id }}
          GENERATION_RUN_ATTEMPT: ${{ steps.branch.outputs.generation_workflow_run_attempt }}
        run: |
          set -euo pipefail

          work="$RUNNER_TEMP/deterministic-publication-gate"
          mkdir -p "$work/candidate"
          cp "$GITHUB_EVENT_PATH" "$work/event.json"

          validation_pr_count="$(jq '.workflow_run.pull_requests | length' "$work/event.json")"
          if [[ "$validation_pr_count" != "1" ]]; then
            echo "Expected exactly one pull request on the successful validation run; found $validation_pr_count." >&2
            exit 1
          fi

          pr_number="$(jq -r '.workflow_run.pull_requests[0].number' "$work/event.json")"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr_number" > "$work/pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/${{ github.event.workflow_run.id }}" > "$work/validation-run.json"

          expected_artifact="deterministic-publication-attestation-${GENERATION_RUN_ID}-${GENERATION_RUN_ATTEMPT}"
          ready=false
          for poll in $(seq 1 12); do
            gh api "/repos/$GITHUB_REPOSITORY/actions/runs/${GENERATION_RUN_ID}" > "$work/generation-run.json"
            gh api "/repos/$GITHUB_REPOSITORY/actions/runs/${GENERATION_RUN_ID}/artifacts" > "$work/artifacts.json"

            generation_status="$(jq -r '.status // ""' "$work/generation-run.json")"
            generation_conclusion="$(jq -r '.conclusion // ""' "$work/generation-run.json")"
            artifact_count="$(jq --arg name "$expected_artifact" '[.artifacts[] | select(.name == $name)] | length' "$work/artifacts.json")"

            if [[ "$artifact_count" -gt 1 ]]; then
              echo "Ambiguous immutable attestation artifact name $expected_artifact: found $artifact_count." >&2
              exit 1
            fi

            if [[ "$generation_status" == "completed" && "$generation_conclusion" != "success" ]]; then
              echo "Trusted publication-generation run completed without success: $generation_conclusion." >&2
              exit 1
            fi

            if [[ "$generation_status" == "completed" && "$generation_conclusion" == "success" && "$artifact_count" == "1" ]]; then
              ready=true
              break
            fi

            if [[ "$poll" == "12" ]]; then
              break
            fi
            sleep 5
          done

          if [[ "$ready" != "true" ]]; then
            echo "Trusted publication-generation run/attestation did not become unambiguously available inside the bounded wait." >&2
            exit 1
          fi

          artifact_id="$(jq -r --arg name "$expected_artifact" '.artifacts[] | select(.name == $name) | .id' "$work/artifacts.json")"
          artifact_expired="$(jq -r --arg name "$expected_artifact" '.artifacts[] | select(.name == $name) | .expired' "$work/artifacts.json")"
          if [[ "$artifact_expired" == "true" ]]; then
            echo "Immutable attestation artifact is expired." >&2
            exit 1
          fi

          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/${artifact_id}/zip" > "$work/attestation.zip"
          unzip -q "$work/attestation.zip" -d "$work/attestation"
          mapfile -t attestation_files < <(find "$work/attestation" -type f -name 'deterministic-publication-attestation.json' -print)
          if [[ "${#attestation_files[@]}" != "1" ]]; then
            echo "Expected one deterministic-publication-attestation.json in immutable artifact." >&2
            exit 1
          fi
          cp "${attestation_files[0]}" "$work/attestation.json"

          echo "work=$work" >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Validate attestation shape before reading candidate bytes
        id: attestation
        env:
          WORK: ${{ steps.metadata.outputs.work }}
        run: |
          set -euo pipefail
          python scripts/deterministic_site_publication.py validate-attestation \
            --attestation "$WORK/attestation.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Independently verify immutable source-run provenance
        env:
          GH_TOKEN: ${{ github.token }}
          WORK: ${{ steps.metadata.outputs.work }}
        run: |
          set -euo pipefail
          source_run_id="$(jq -er '.source_workflow_run_id | select(type == "number" and . > 0)' "$WORK/attestation.json")"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$source_run_id" > "$WORK/source-run.json"
          event="$(jq -er '.event' "$WORK/source-run.json")"
          printf "{}\n" > "$WORK/source-receipt.json"
          receipt_args=()
          if [[ "$event" == "workflow_dispatch" ]]; then
            hour="$(jq -er '.observation_hour_utc' "$WORK/attestation.json")"
            name="$(python scripts/deterministic_ingestion_provenance.py receipt-name --hour "$hour")"
            mkdir -p "$WORK/accepted-hour"
            gh run download "$source_run_id" --repo "$GITHUB_REPOSITORY" --name "$name" --dir "$WORK/accepted-hour"
            cp "$WORK/accepted-hour/receipt.json" "$WORK/source-receipt.json"
            receipt_args=(--receipt "$WORK/accepted-hour/receipt.json")
          fi
          python scripts/deterministic_ingestion_provenance.py verify \
            --source-run "$WORK/source-run.json" --evidence "$WORK/attestation.json" \
            --repository "$GITHUB_REPOSITORY" "${receipt_args[@]}"

      - name: Read exact candidate bytes and decision metadata
        env:
          WORK: ${{ steps.metadata.outputs.work }}
          PR_NUMBER: ${{ steps.metadata.outputs.pr_number }}
          SNAPSHOT_PATH: ${{ steps.attestation.outputs.snapshot_path }}
          REPORT_PATH: ${{ steps.attestation.outputs.report_path }}
          CANDIDATE_HEAD_SHA: ${{ steps.attestation.outputs.candidate_head_sha }}
        run: |
          set -euo pipefail

          gh api "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" > "$WORK/files.json"
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/commits/$CANDIDATE_HEAD_SHA/check-runs?per_page=100" > "$WORK/check-runs.json"
          gh api --paginate --slurp \
            "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews?per_page=100" \
            | jq 'add // []' > "$WORK/reviews.json"
          gh api "/repos/$GITHUB_REPOSITORY/commits/main" > "$WORK/main.json"

          owner="${GITHUB_REPOSITORY%%/*}"
          name="${GITHUB_REPOSITORY#*/}"
          gh api graphql \
            -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100){totalCount pageInfo{hasNextPage} nodes{isResolved}}}}}' \
            -f owner="$owner" \
            -f name="$name" \
            -F number="$PR_NUMBER" > "$WORK/threads.json"

          if ! jq -e '
            .data.repository.pullRequest.reviewThreads
            | (.pageInfo.hasNextPage == false)
              and (.totalCount == (.nodes | length))
          ' "$WORK/threads.json" >/dev/null; then
            echo "Review thread metadata is incomplete; refusing publication eligibility." >&2
            exit 1
          fi

          gh api -H "Accept: application/vnd.github.raw+json" \
            "/repos/$GITHUB_REPOSITORY/contents/$SNAPSHOT_PATH?ref=$CANDIDATE_HEAD_SHA" > "$WORK/candidate/snapshot.json"
          gh api -H "Accept: application/vnd.github.raw+json" \
            "/repos/$GITHUB_REPOSITORY/contents/$REPORT_PATH?ref=$CANDIDATE_HEAD_SHA" > "$WORK/candidate/report.md"

          # Bind the pre-armed run number to GitHub's immutable scheduled-run
          # metadata, rather than trusting PR text or generation output.
          if [[ "$ACTIVATION" == "pilot" && -n "$PILOT_RUN_NUMBER" ]]; then
            source_run_id="$(jq -er '.source_workflow_run_id | select(type == "number" and . > 0)' "$WORK/attestation.json")"
            gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$source_run_id" > "$WORK/pilot-source-run.json"
          else
            printf '{}\n' > "$WORK/pilot-source-run.json"
          fi

      - name: Build credential-free gate facts
        env:
          WORK: ${{ steps.metadata.outputs.work }}
        run: |
          set -euo pipefail
          python scripts/deterministic_site_publication.py build-gate-facts \
            --attestation "$WORK/attestation.json" \
            --pr-json "$WORK/pr.json" \
            --generation-run-json "$WORK/generation-run.json" \
            --validation-run-json "$WORK/validation-run.json" \
            --check-runs-json "$WORK/check-runs.json" \
            --reviews-json "$WORK/reviews.json" \
            --threads-json "$WORK/threads.json" \
            --main-json "$WORK/main.json" \
            --files-json "$WORK/files.json" \
            --snapshot-file "$WORK/candidate/snapshot.json" \
            --report-file "$WORK/candidate/report.md" \
            --main-root . \
            --activation "$ACTIVATION" \
            --pilot-run-id "$PILOT_RUN_ID" \
            --pilot-run-number "$PILOT_RUN_NUMBER" \
            --pilot-source-run-json "$WORK/pilot-source-run.json" \
            --source-run-json "$WORK/source-run.json" \
            --source-receipt-json "$WORK/source-receipt.json" \
            --source-repository "$GITHUB_REPOSITORY" \
            --attestation-count 1 \
            --output "$WORK/facts.json"

      - name: Evaluate closed publication contract
        id: policy
        env:
          WORK: ${{ steps.metadata.outputs.work }}
        run: |
          set -euo pipefail
          python scripts/deterministic_site_publication.py gate \
            --attestation "$WORK/attestation.json" \
            --facts "$WORK/facts.json" \
            --output "$WORK/decision.json" \
            --github-output "$GITHUB_OUTPUT"
          cat "$WORK/decision.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Export SHA-bound merge identity
        id: identity
        env:
          WORK: ${{ steps.metadata.outputs.work }}
        run: |
          set -euo pipefail
          echo "pr_number=$(jq -r '.pull_request_number' "$WORK/attestation.json")" >> "$GITHUB_OUTPUT"
          echo "candidate_head_sha=$(jq -r '.candidate_head_sha' "$WORK/attestation.json")" >> "$GITHUB_OUTPUT"
          echo "main_base_sha=$(jq -r '.main_base_sha' "$WORK/attestation.json")" >> "$GITHUB_OUTPUT"

  merge:
    name: Merge exact eligible publication candidate
    needs: preflight
    if: needs.preflight.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    environment: deterministic-publication-control
    permissions:
      contents: read
      pull-requests: read
    env:
      PR_NUMBER: ${{ needs.preflight.outputs.pr_number }}
      CANDIDATE_HEAD_SHA: ${{ needs.preflight.outputs.candidate_head_sha }}
      MAIN_BASE_SHA: ${{ needs.preflight.outputs.main_base_sha }}

    steps:
      - name: Final read-only stale/head check before token minting
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_head="$(gh api "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')"
          current_main="$(gh api "/repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          test "$current_head" = "$CANDIDATE_HEAD_SHA"
          test "$current_main" = "$MAIN_BASE_SHA"

      - name: Mint short-lived repository-scoped publication App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.DETERMINISTIC_PUBLICATION_APP_ID }}
          private-key: ${{ secrets.DETERMINISTIC_PUBLICATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: SHA-bound pull-request merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          gh api \
            --method PUT \
            "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/merge" \
            -f sha="$CANDIDATE_HEAD_SHA" \
            -f merge_method=merge

  daily-preflight:
    name: Independently verify daily publication candidate (no merge)
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'automation/daily-publication-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install report validation dependencies
        run: python -m pip install pyyaml markdown
      - name: Fetch exact PR, generation run and immutable attestation
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_RUN: ${{ github.event.workflow_run.id }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          run_id="${BRANCH#automation/daily-publication-}"
          run_id="${run_id%%-*}"
          attempt_date="${BRANCH#automation/daily-publication-${run_id}-}"
          attempt="${attempt_date%%-*}"
          date_part="${attempt_date#${attempt}-}"
          artifact="cryptopulse-daily-attestation-${run_id}-${attempt}"
          mkdir -p "$RUNNER_TEMP/daily-gate/artifact"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$VALIDATION_RUN" > "$RUNNER_TEMP/daily-gate/validation.json"
          test "$(jq -r '.head_sha' "$RUNNER_TEMP/daily-gate/validation.json")" = "$HEAD_SHA"
          test "$(jq -r '.name' "$RUNNER_TEMP/daily-gate/validation.json")" = "Validate CryptoPulse PR"
          pr_count="$(jq '.pull_requests | length' "$RUNNER_TEMP/daily-gate/validation.json")"
          test "$pr_count" = "1"
          pr_number="$(jq -r '.pull_requests[0].number' "$RUNNER_TEMP/daily-gate/validation.json")"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr_number" > "$RUNNER_TEMP/daily-gate/pr.json"
          # Validation may finish before the generator uploads its final attestation.
          # Wait only for the exact generation attempt and exact artifact name.
          ready=false
          for poll in $(seq 1 12); do
            gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > "$RUNNER_TEMP/daily-gate/generation.json"
            gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" > "$RUNNER_TEMP/daily-gate/artifacts.json"
            count="$(jq --arg n "$artifact" '[.artifacts[] | select(.name == $n)] | length' "$RUNNER_TEMP/daily-gate/artifacts.json")"
            test "$count" -le 1
            state="$(jq -r '.status' "$RUNNER_TEMP/daily-gate/generation.json")"
            result="$(jq -r '.conclusion // ""' "$RUNNER_TEMP/daily-gate/generation.json")"
            if [[ "$state" == "completed" && "$result" != "success" ]]; then
              echo "Daily generation failed: $result" >&2
              exit 1
            fi
            if [[ "$state" == "completed" && "$result" == "success" && "$count" == "1" ]]; then
              ready=true
              break
            fi
            test "$poll" != "12" || break
            sleep 5
          done
          test "$ready" = true
          expired="$(jq --arg n "$artifact" '.artifacts[] | select(.name == $n) | .expired' "$RUNNER_TEMP/daily-gate/artifacts.json")"
          test "$expired" = "false"
          id="$(jq --arg n "$artifact" '.artifacts[] | select(.name == $n) | .id' "$RUNNER_TEMP/daily-gate/artifacts.json")"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$RUNNER_TEMP/daily-gate/attestation.zip"
          unzip -q "$RUNNER_TEMP/daily-gate/attestation.zip" -d "$RUNNER_TEMP/daily-gate/artifact"
          attestation="$RUNNER_TEMP/daily-gate/artifact/cryptopulse-daily-attestation.json"
          test -f "$attestation"
          cp "$attestation" "$RUNNER_TEMP/daily-gate/attestation.json"
          echo "pr_number=$pr_number" >> "$GITHUB_ENV"
          echo "daily_run_id=$run_id" >> "$GITHUB_ENV"
          echo "daily_run_attempt=$attempt" >> "$GITHUB_ENV"
          echo "candidate_branch=$BRANCH" >> "$GITHUB_ENV"
          echo "candidate_head=$HEAD_SHA" >> "$GITHUB_ENV"
      - name: Re-read source bytes and independently replay the daily candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          att="$RUNNER_TEMP/daily-gate/attestation.json"
          python scripts/deterministic_site_publication.py validate-daily-attestation --attestation "$att"
          report_path="$(jq -er '.report_path' "$att")"
          git fetch --no-tags origin "refs/pull/$pr_number/head:refs/remotes/origin/daily-candidate"
          test "$(git rev-parse refs/remotes/origin/daily-candidate)" = "$candidate_head"
          git show "$candidate_head:$report_path" > "$RUNNER_TEMP/daily-gate/report.md"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr_number/files?per_page=100" > "$RUNNER_TEMP/daily-gate/files.json"
          python - "$RUNNER_TEMP/daily-gate/files.json" "$RUNNER_TEMP/daily-gate/paths.json" <<'PY'
          import json,sys
          rows=json.load(open(sys.argv[1],encoding="utf-8"))
          json.dump([r["filename"] for r in rows],open(sys.argv[2],"w",encoding="utf-8"))
          PY
          python - "$att" "$RUNNER_TEMP/daily-gate/report.md" "$RUNNER_TEMP/daily-gate/paths.json" <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd() / "scripts"))
          from daily_publication import independently_validate_candidate
          att=json.load(open(sys.argv[1],encoding="utf-8"))
          paths=json.load(open(sys.argv[3],encoding="utf-8"))
          independently_validate_candidate(Path.cwd(),att,Path(sys.argv[2]).read_bytes(),paths)
          PY
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$daily_run_id" > "$RUNNER_TEMP/daily-gate/generation.json"
          gh api "/repos/$GITHUB_REPOSITORY/commits/$candidate_head/check-runs" > "$RUNNER_TEMP/daily-gate/checks.json"
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 500 --json number,headRefName > "$RUNNER_TEMP/daily-gate/open-prs.json"
          gh api "/repos/$GITHUB_REPOSITORY/commits/main" > "$RUNNER_TEMP/daily-gate/main.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr_number" > "$RUNNER_TEMP/daily-gate/pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr_number/files?per_page=100" > "$RUNNER_TEMP/daily-gate/files-api.json"
          export DAILY_GATE_DIR="$RUNNER_TEMP/daily-gate"
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          d=Path(os.environ["DAILY_GATE_DIR"])
          read=lambda n: json.load(open(d/n,encoding="utf-8"))
          a=read("attestation.json"); p=read("pr.json"); g=read("generation.json")
          v=read("validation.json"); c=read("checks.json"); files=read("files-api.json")
          main=read("main.json"); opens=read("open-prs.json"); artifacts=read("artifacts.json")
          expected_name=f"cryptopulse-daily-attestation-{a['generation_run_id']}-{a['generation_run_attempt']}"
          artifact_rows=[x for x in artifacts.get("artifacts",[]) if x.get("name")==expected_name]
          check_rows=[x for x in c.get("check_runs",[]) if x.get("name")=="Build site and check generated output"]
          check=max(check_rows,key=lambda x:x.get("completed_at") or "") if check_rows else {}
          date_path=a["report_path"]
          try: subprocess.run(["git","cat-file","-e",f"{main['sha']}:{date_path}"],check=True,capture_output=True); duplicate=1
          except Exception: duplicate=0
          cutoff_tip=subprocess.run(["git","rev-list","--first-parent","-n","1","--before="+a["cutoff_utc"],"refs/remotes/origin/main"],check=True,capture_output=True,text=True).stdout.strip()
          facts={"source_ancestor_at_cutoff":cutoff_tip == a["trusted_main_sha"],"source_replay_valid":True,"source_population_valid":True,"report_replay_valid":True,
            "changed_files":[x.get("filename","") for x in files],"duplicate_date_count":duplicate,
            "duplicate_candidate_count":sum(x.get("number")!=p.get("number") and str(x.get("headRefName","")).startswith("automation/daily-publication-") and str(x.get("headRefName","")).endswith("-"+a["reporting_date_utc"]) for x in opens),
            "pr_number":p.get("number"),"same_repository":(p.get("head",{}).get("repo") or {}).get("id")==((p.get("base",{}).get("repo") or {}).get("id")),"pr_open":p.get("state")=="open","pr_author_id":(p.get("user") or {}).get("id"),"pr_author_login":(p.get("user") or {}).get("login"),
            "pr_head_sha":(p.get("head") or {}).get("sha"),"pr_head_ref":(p.get("head") or {}).get("ref"),"pr_base":(p.get("base") or {}).get("ref"),
            "current_main_sha":main.get("sha"),"validation_head_sha":v.get("head_sha"),"validation_status":check.get("conclusion"),"validation_check":check.get("name"),"validation_app_slug":(check.get("app") or {}).get("slug"),
            "attestation_count":len(artifact_rows),"attestation_expired":artifact_rows[0].get("expired") if artifact_rows else True,"artifact_name":expected_name,
            "generation_run_id":g.get("id"),"generation_workflow_id":g.get("workflow_id"),"generation_workflow_path":g.get("path"),"generation_head_sha":g.get("head_sha"),"trusted_generation_run":g.get("event")=="workflow_dispatch" and g.get("head_branch")=="main" and g.get("conclusion")=="success",
            "report_path":a.get("report_path"),"report_sha256":hashlib.sha256((d/"report.md").read_bytes()).hexdigest()}
          json.dump(facts,open(d/"facts.json","w",encoding="utf-8"),sort_keys=True)
          PY
          python scripts/deterministic_site_publication.py daily-gate-preflight --attestation "$RUNNER_TEMP/daily-gate/attestation.json" --facts "$RUNNER_TEMP/daily-gate/facts.json"
      - name: Record read-only preflight result
        if: always()
        run: echo "Daily publication preflight has no merge or write capability."
