name: Finalise Slice 6 corrective invariants

on:
  push:
    branches:
      - agent/correct-phase-6-slice-6-provider-transport

permissions:
  contents: write

jobs:
  finalise:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/correct-phase-6-slice-6-provider-transport
      - name: Apply final invariant and remove branch-only workflows
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          loader = Path('llm_analysis/candidate_selection_model_comparison_config.py')
          source = loader.read_text()
          old = '''        minimum_model_ceiling = (
            model_row.repeats_per_case
            * 5
            * 2
            * model_row.maximum_generation_cost_usd
        )
'''
          new = '''        minimum_model_ceiling = (
            (1 + model_row.repeats_per_case * 5 * 2)
            * model_row.maximum_generation_cost_usd
        )
'''
          if old in source:
              source = source.replace(old, new, 1)
          if new not in source:
              raise SystemExit('route-inclusive model ceiling invariant missing')
          loader.write_text(source)

          replacements = {
              'tests/test_candidate_selection_model_comparison.py': [
                  ('                    4.51,\n', '                    4.66,\n'),
              ],
              'docs/reference/candidate-selection-model-comparison.md': [
                  ('| GPT-5.6 Sol | USD 0.15 | USD 4.51 |', '| GPT-5.6 Sol | USD 0.15 | USD 4.66 |'),
              ],
              'evaluation/phase-06/candidate-selection-model-comparison/README.md': [
                  ('USD 4.51 per GPT model run', 'USD 4.66 per GPT model run'),
              ],
              'evaluation/phase-06/candidate-selection-model-comparison/scoring-contract.md': [
                  ('| GPT-5.6 Sol | USD 0.15 | USD 4.51 | 1,024 |', '| GPT-5.6 Sol | USD 0.15 | USD 4.66 | 1,024 |'),
              ],
          }
          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for before, after in pairs:
                  if before in text:
                      text = text.replace(before, after, 1)
                  if after not in text:
                      raise SystemExit(f'{filename}: expected corrected text missing')
              path.write_text(text)
          PY

          git rm -f .github/workflows/phase6-slice6-route-budget-patch.yml || true
          git rm -f .github/workflows/phase6-slice6-final-cleanup.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add llm_analysis/candidate_selection_model_comparison_config.py \
            tests/test_candidate_selection_model_comparison.py \
            docs/reference/candidate-selection-model-comparison.md \
            evaluation/phase-06/candidate-selection-model-comparison/README.md \
            evaluation/phase-06/candidate-selection-model-comparison/scoring-contract.md
          git commit -m 'Finalise route-inclusive Slice 6 budgets'
          git push
