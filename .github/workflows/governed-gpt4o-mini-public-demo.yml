name: Governed GPT-4o mini public-data demo

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: governed-gpt4o-mini-public-demo-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  guard:
    name: Require trusted main dispatch
    runs-on: ubuntu-latest
    steps:
      - name: Reject non-main workflow refs
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "This workflow must be dispatched from the main branch." >&2
            exit 1
          fi

  prepare:
    name: Freeze and classify public-data demo corpus
    needs: guard
    runs-on: ubuntu-latest
    outputs:
      trusted_sha: ${{ steps.trusted.outputs.sha }}
    steps:
      - name: Check out trusted main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Record trusted main commit
        id: trusted
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependency
        run: pip install pyyaml

      - name: Validate public input boundary and build deterministic bundles
        shell: bash
        run: |
          set -euo pipefail
          python -m llm_analysis.public_demo_benchmark_compat prepare \
            --repository-root . \
            --profile config/llm-public-data-demo.yml \
            --output-dir "$RUNNER_TEMP/governed-gpt4o-mini-public-demo-prepared"

      - name: Upload prepared public-data corpus
        uses: actions/upload-artifact@v4
        with:
          name: governed-gpt4o-mini-public-demo-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/governed-gpt4o-mini-public-demo-prepared/
          if-no-files-found: error
          retention-days: 7

  evaluate:
    name: Run bounded protected GPT-4o mini public-data demo
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: governed-llm-dry-run
    steps:
      - name: Check out exact trusted main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.trusted_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify trusted commit
        env:
          TRUSTED_SHA: ${{ needs.prepare.outputs.trusted_sha }}
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$TRUSTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependency
        run: pip install pyyaml

      - name: Download prepared public-data corpus
        uses: actions/download-artifact@v4
        with:
          name: governed-gpt4o-mini-public-demo-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/governed-gpt4o-mini-public-demo-prepared

      - name: Run controlled public-data demo benchmark
        id: benchmark
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TRUSTED_SHA: ${{ needs.prepare.outputs.trusted_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python -m llm_analysis.public_demo_benchmark_compat run \
            --repository-root . \
            --profile config/llm-public-data-demo.yml \
            --viability-config config/llm-evaluation-viability.yml \
            --prepared-dir "$RUNNER_TEMP/governed-gpt4o-mini-public-demo-prepared" \
            --output-dir "$RUNNER_TEMP/governed-gpt4o-mini-public-demo" \
            --trusted-main-sha "$TRUSTED_SHA"

      - name: Publish demo benchmark summary
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/governed-gpt4o-mini-public-demo/actions-summary.md" ]]; then
            cat "$RUNNER_TEMP/governed-gpt4o-mini-public-demo/actions-summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "# Governed GPT-4o mini public-data demo" >> "$GITHUB_STEP_SUMMARY"
            echo "The benchmark failed before a complete diagnostic summary was produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload non-published demo artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governed-gpt4o-mini-public-demo-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/governed-gpt4o-mini-public-demo/
          if-no-files-found: warn
          retention-days: 30

      - name: Fail when demo benchmark infrastructure failed
        if: steps.benchmark.outcome != 'success'
        shell: bash
        run: |
          echo "The controlled public-data demo benchmark did not complete. Review diagnostic artefacts." >&2
          exit 1
