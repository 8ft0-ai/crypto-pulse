name: Clean Slice 5 evaluator import

on:
  push:
    branches:
      - agent/phase-6-slice-5-bounded-candidate-selection

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-6-slice-5-bounded-candidate-selection
      - name: Use the explicit evaluation-only validation fixture
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('llm_analysis/candidate_selection_evaluation.py')
          source = path.read_text()
          source = source.replace('    validation_matrix,\n', '')
          marker = 'from .candidate_selector import (\n'
          replacement = 'from .candidate_selection_validation_proof import validation_matrix\n' + marker
          if marker not in source:
              raise SystemExit('candidate selector import marker missing')
          source = source.replace(marker, replacement, 1)
          path.write_text(source)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add llm_analysis/candidate_selection_evaluation.py
          git commit -m 'Use explicit selector validation proof fixture'
          git push
