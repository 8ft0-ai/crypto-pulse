name: Semantic plan screen — 5 catalogue candidates

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: governed-semantic-plan-model-catalogue-screen-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  guard:
    name: Require trusted main dispatch
    runs-on: ubuntu-latest
    steps:
      - name: Reject non-main workflow refs
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "This workflow must be dispatched from the main branch." >&2
            exit 1
          fi

  prepare:
    name: Freeze catalogue screen corpus
    needs: guard
    runs-on: ubuntu-latest
    outputs:
      trusted_sha: ${{ steps.trusted.outputs.sha }}
    steps:
      - name: Check out trusted main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Record trusted main commit
        id: trusted
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish catalogue screen preflight
        env:
          TRUSTED_SHA: ${{ steps.trusted.outputs.sha }}
        shell: bash
        run: |
          {
            echo "# Five-model semantic plan screen preflight"
            echo ""
            echo "- Plan: semantic-plan-model-catalogue-screen/v1"
            echo "- Trusted main SHA: $TRUSTED_SHA"
            echo "- Candidates: deepseek/deepseek-v4-flash, openai/gpt-5.6-luna, qwen/qwen3.6-flash, xiaomi/mimo-v2.5-pro, bytedance-seed/seed-2.0-mini"
            echo "- Smoke case: historical-normal-crosschecked"
            echo "- Maximum substantive generations: 5"
            echo "- Maximum route probes: 5"
            echo "- Whole-run cost ceiling: USD 0.15"
            echo "- Evidence transform: Coinbase USD spot price -> price_usd"
            echo "- Request compatibility transforms: source-controlled per model"
            echo "- Reasoning policy: source-controlled and live-catalogue checked"
            echo "- Validator-gated quality scoring: enabled"
            echo "- Quality leaderboard: disabled"
            echo "- Deployment selection: disabled"
            echo "- Cross-model fallback: false"
            echo "- Automatic generation: false"
            echo "- Publication: false"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependency
        run: pip install pyyaml

      - name: Validate and freeze the existing semantic corpus
        shell: bash
        run: |
          set -euo pipefail
          python -m llm_analysis.semantic_plan_model_evaluation prepare \
            --repository-root . \
            --config config/semantic-plan-model-selection.yml \
            --output-dir "$RUNNER_TEMP/semantic-plan-model-catalogue-screen-prepared"

      - name: Upload prepared corpus
        uses: actions/upload-artifact@v4
        with:
          name: semantic-plan-model-catalogue-screen-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/semantic-plan-model-catalogue-screen-prepared/
          if-no-files-found: error
          retention-days: 7

  screen:
    name: Run protected five-model catalogue screen
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: governed-llm-dry-run
    steps:
      - name: Check out exact trusted main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.trusted_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify trusted commit
        env:
          TRUSTED_SHA: ${{ needs.prepare.outputs.trusted_sha }}
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$TRUSTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependency
        run: pip install pyyaml

      - name: Download prepared corpus
        uses: actions/download-artifact@v4
        with:
          name: semantic-plan-model-catalogue-screen-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/semantic-plan-model-catalogue-screen-prepared

      - name: Run five-model catalogue screen
        id: screen
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TRUSTED_SHA: ${{ needs.prepare.outputs.trusted_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python -m llm_analysis.semantic_plan_model_catalogue_screen \
            --repository-root . \
            --config config/semantic-plan-model-catalogue-screen.yml \
            --prepared-dir "$RUNNER_TEMP/semantic-plan-model-catalogue-screen-prepared" \
            --output-dir "$RUNNER_TEMP/semantic-plan-model-catalogue-screen" \
            --trusted-main-sha "$TRUSTED_SHA"

      - name: Publish catalogue screen summary
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/semantic-plan-model-catalogue-screen/actions-summary.md" ]]; then
            cat "$RUNNER_TEMP/semantic-plan-model-catalogue-screen/actions-summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "# Five-model semantic claim-plan catalogue screen" >> "$GITHUB_STEP_SUMMARY"
            echo "The screen failed before a complete summary was produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload protected catalogue screen artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-plan-model-catalogue-screen-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/semantic-plan-model-catalogue-screen/
          if-no-files-found: warn
          retention-days: 30

      - name: Fail when catalogue screen infrastructure failed
        if: steps.screen.outcome != 'success'
        shell: bash
        run: |
          echo "The controlled catalogue screen did not complete. Review retained diagnostics." >&2
          exit 1
