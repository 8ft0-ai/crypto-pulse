name: Governed low-cost selector Stage 0

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: governed-low-cost-selector-stage-0-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  guard:
    name: Require trusted main dispatch
    runs-on: ubuntu-24.04
    steps:
      - name: Reject non-main workflow refs
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "This workflow must be dispatched from main." >&2
            exit 1
          fi

  prepare:
    name: Freeze real Stage 0 selector input
    needs: guard
    runs-on: ubuntu-24.04
    outputs:
      trusted_sha: ${{ steps.trusted.outputs.sha }}
    steps:
      - name: Check out trusted main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Record trusted main commit
        id: trusted
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependency
        run: pip install pyyaml

      - name: Regenerate the real 201-candidate input
        shell: bash
        run: |
          set -euo pipefail
          python -m llm_analysis.candidate_selector_stage0_runner prepare \
            --repository-root . \
            --config config/low-cost-candidate-selector-stage-0.yml \
            --output-dir "$RUNNER_TEMP/low-cost-selector-stage-0-prepared"

      - name: Upload prepared Stage 0 input
        uses: actions/upload-artifact@v4
        with:
          name: low-cost-selector-stage-0-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/low-cost-selector-stage-0-prepared/
          if-no-files-found: error
          retention-days: 7

  evaluate:
    name: Run protected low-cost selector Stage 0
    needs: prepare
    runs-on: ubuntu-24.04
    environment: governed-llm-dry-run
    steps:
      - name: Check out exact trusted main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.trusted_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify trusted commit
        env:
          TRUSTED_SHA: ${{ needs.prepare.outputs.trusted_sha }}
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$TRUSTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependency
        run: pip install pyyaml

      - name: Download prepared Stage 0 input
        uses: actions/download-artifact@v4
        with:
          name: low-cost-selector-stage-0-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/low-cost-selector-stage-0-prepared

      - name: Run exact three-model compatibility screen
        id: screen
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TRUSTED_SHA: ${{ needs.prepare.outputs.trusted_sha }}
          CRYPTOPULSE_SELECTOR_EVIDENCE_DIR: ${{ runner.temp }}/low-cost-selector-stage-0/provider-evidence
        shell: bash
        run: |
          set -euo pipefail
          python -m llm_analysis.candidate_selector_stage0_runner run \
            --repository-root . \
            --config config/low-cost-candidate-selector-stage-0.yml \
            --prepared-dir "$RUNNER_TEMP/low-cost-selector-stage-0-prepared" \
            --output-dir "$RUNNER_TEMP/low-cost-selector-stage-0" \
            --trusted-main-sha "$TRUSTED_SHA"

      - name: Publish Stage 0 summary
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/low-cost-selector-stage-0/actions-summary.md" ]]; then
            cat "$RUNNER_TEMP/low-cost-selector-stage-0/actions-summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "# Phase 7 Stage 0" >> "$GITHUB_STEP_SUMMARY"
            echo "The protected screen failed before a complete summary was produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload protected Stage 0 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: low-cost-selector-stage-0-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/low-cost-selector-stage-0/
          if-no-files-found: warn
          retention-days: 30

      - name: Fail when Stage 0 execution integrity failed
        if: steps.screen.outcome != 'success'
        shell: bash
        run: |
          echo "The protected Stage 0 screen did not complete. Review retained evidence." >&2
          exit 1
