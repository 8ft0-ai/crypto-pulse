name: Reconcile issue 279 patch run

on:
  pull_request:
    paths:
      - .github/workflows/reconcile-issue-279-patch-run.yml

permissions:
  actions: read
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - name: Query issue-comment patch workflow run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request

          url = (
              f"https://api.github.com/repos/{os.environ['REPOSITORY']}"
              "/actions/workflows/apply-issue-279-fix.yml/runs"
              "?event=issue_comment&per_page=10"
          )
          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "cryptopulse-issue279-reconciliation",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)
          rows = [
              {
                  "id": row.get("id"),
                  "status": row.get("status"),
                  "conclusion": row.get("conclusion"),
                  "event": row.get("event"),
                  "head_sha": row.get("head_sha"),
                  "created_at": row.get("created_at"),
                  "updated_at": row.get("updated_at"),
                  "html_url": row.get("html_url"),
              }
              for row in payload.get("workflow_runs", [])
          ]
          print("ISSUE279_PATCH_RUNS=" + json.dumps(rows, sort_keys=True))
          if len(rows) != 1:
              raise SystemExit(f"expected exactly one issue-comment run, found {len(rows)}")
          PY
